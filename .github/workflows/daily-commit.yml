name: Daily README Update

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at 00:00 UTC
  workflow_dispatch:   # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing commits
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          # Updates the 'Last Updated' line in README.md
          sed -i "s/^Last Updated: .*/Last Updated: $(date -u)/" README.md || echo "Last Updated: $(date -u)" >> README.md

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily automated update [skip ci]"
